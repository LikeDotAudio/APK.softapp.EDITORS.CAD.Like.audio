name: Publish to cad.like.audio

# Builds the Vite app once and publishes dist/ twice: to GitHub Pages at
# https://likedotaudio.github.io/APK.softapp.EDITORS.CAD.Like.audio/ and over
# FTPS to the web host that serves cad.like.audio today.
#
# FTPS needs the repository secrets FTP_SERVER, FTP_USERNAME, FTP_PASSWORD and
# optionally the variable FTP_SERVER_DIR (defaults to the account root).
#
# DNS: cad.like.audio must be a CNAME to likedotaudio.github.io BEFORE the
# domain is set in Settings → Pages, or the github.io address redirects to a
# host that is not serving this site.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci || npm install

      - name: 🧪 Test (vitest — DXF round-trip and the rest)
        run: npm test

      - name: 🛠️ Build project
        run: npm run build

      - name: 📂 Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/

      - name: 📦 Keep dist/ for FTPS
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: ./dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  ftps:
    name: Deploy to cad.like.audio (FTPS)
    needs: build
    runs-on: ubuntu-latest
    concurrency:
      group: ftps-deploy
      cancel-in-progress: false
    steps:
      - name: 📥 Get dist/
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: ./dist/

      - name: 📂 Sync files via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
