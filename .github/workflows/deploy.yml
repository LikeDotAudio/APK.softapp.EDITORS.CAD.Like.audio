name: Publish to cad.like.audio

# Builds the Vite app and publishes dist/ to GitHub Pages, served at the
# custom domain cad.like.audio (Settings → Pages → Custom domain).
#
# DNS: cad.like.audio is a CNAME to likedotaudio.github.io.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci || npm install

      - name: 🛠️ Build project
        run: npm run build

      - name: 📂 Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist/

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 🚀 Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
