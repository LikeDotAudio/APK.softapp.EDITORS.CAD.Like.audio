name: Publish to cad.like.audio

# Builds the Vite app and uploads dist/ to the web host over FTPS.
#
# Required repository secrets (Settings → Secrets and variables → Actions):
#   FTP_SERVER    — FTP host
#   FTP_USERNAME  — FTP account
#   FTP_PASSWORD  — FTP password
# Optional repository variable:
#   FTP_SERVER_DIR — remote target directory (defaults to the account root)

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ftps-deploy
  cancel-in-progress: true

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 📦 Install dependencies
        run: npm ci || npm install

      - name: 🛠️ Build project
        run: npm run build

      - name: 📂 Sync files via FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          port: 21
          local-dir: ./dist/
          server-dir: ${{ vars.FTP_SERVER_DIR || './' }}
          state-name: .ftp-deploy-sync-state.json
          dangerous-clean-slate: false
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
